<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recreated GUI - nosts.png</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .gui-container {
            position: relative;
            width: 1920px;
            height: 1080px;
            border: 2px solid #ccc;
            background: white;
        }
        .widget {
            position: absolute;
            border: 1px solid #888;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .button {
            background: #e0e0e0;
            border: 2px solid #888;
            font-weight: bold;
            cursor: pointer;
        }
        .label {
            background: white;
            border: 1px solid #ccc;
            text-align: left;
            padding-left: 5px;
        }
        .entry {
            background: white;
            border: 2px solid #666;
            text-align: left;
            padding-left: 5px;
        }
        .table {
            background: #f9f9f9;
            border: 2px solid #333;
            font-style: italic;
        }
        .plot {
            background: #f0f0ff;
            border: 2px solid #333;
            font-style: italic;
        }
        .video {
            background: #000;
            border: 2px solid #333;
            color: white;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>Recreated GUI: nosts.png</h1>
    <p>Detected 0 widgets</p>
    <div class="gui-container">
    </div>
</body>
</html>
