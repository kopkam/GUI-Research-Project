<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>App-like Random GUI Generator</title>
</head>

<body>

<div id="app"></div>

<script>
// ---------------- Constants ----------------
const SCREEN_WIDTH = 1200;
const SCREEN_HEIGHT = 800;

const HEADER_HEIGHT = 80;
const SIDEBAR_WIDTH = 200;
const PADDING = 10;

const WIDGET_TYPES = ["button", "input", "label", "checkbox"];

// ---------------- Utility ----------------
function rand(min, max) {
  return Math.floor(Math.random() * (max - min)) + min;
}

function choice(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

// ---------------- State ----------------
let GUI_STATE = {
  screen: { width: SCREEN_WIDTH, height: SCREEN_HEIGHT },
  containers: []
};

let widgetCounter = 0;

// ---------------- Main ----------------
function generateGUI() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  app.style.position = "relative";
  app.style.width = SCREEN_WIDTH + "px";
  app.style.height = SCREEN_HEIGHT + "px";
  app.style.border = "2px solid black";

  createHeader(app);
  createSidebar(app);
  createMainContent(app);

  exportJSON();
}

// ---------------- Header ----------------
function createHeader(parent) {
  const div = createContainer("header", 0, 0, SCREEN_WIDTH, HEADER_HEIGHT, parent);
  generateHorizontalWidgets(div, "header");
}

// ---------------- Sidebar ----------------
function createSidebar(parent) {
  const div = createContainer(
    "sidebar",
    0,
    HEADER_HEIGHT,
    SIDEBAR_WIDTH,
    SCREEN_HEIGHT - HEADER_HEIGHT,
    parent
  );
  generateVerticalWidgets(div, "sidebar");
}

// ---------------- Main Content ----------------
function createMainContent(parent) {
  const div = createContainer(
    "main",
    SIDEBAR_WIDTH,
    HEADER_HEIGHT,
    SCREEN_WIDTH - SIDEBAR_WIDTH,
    SCREEN_HEIGHT - HEADER_HEIGHT,
    parent
  );

  const layout = choice(["form", "grid"]);
  if (layout === "form") generateFormWidgets(div, "main");
  else generateGridWidgets(div, "main");
}

// ---------------- Container Factory ----------------
function createContainer(id, x, y, w, h, parent) {
  const div = document.createElement("div");
  div.style.position = "absolute";
  div.style.left = x + "px";
  div.style.top = y + "px";
  div.style.width = w + "px";
  div.style.height = h + "px";
  div.style.border = "1px solid gray";

  parent.appendChild(div);

  GUI_STATE.containers.push({
    id: id,
    x: x,
    y: y,
    width: w,
    height: h,
    widgets: []
  });

  return div;
}

// ---------------- Layout Generators ----------------
function generateHorizontalWidgets(container, cid) {
  let x = PADDING;
  let y = PADDING;
  const h = HEADER_HEIGHT - 2 * PADDING;

  const count = rand(3, 6);

  for (let i = 0; i < count; i++) {
    const w = 100;
    createWidget(container, cid, x, y, w, h);
    x += w + PADDING;
  }
}

function generateVerticalWidgets(container, cid) {
  let x = PADDING;
  let y = PADDING;
  const w = SIDEBAR_WIDTH - 2 * PADDING;

  const count = rand(4, 8);

  for (let i = 0; i < count; i++) {
    const h = 35;
    createWidget(container, cid, x, y, w, h);
    y += h + PADDING;
  }
}

function generateFormWidgets(container, cid) {
  let x = PADDING;
  let y = PADDING;
  const w = container.clientWidth - 2 * PADDING;

  const count = rand(4, 8);

  for (let i = 0; i < count; i++) {
    const h = 35;
    createWidget(container, cid, x, y, w, h);
    y += h + PADDING;
  }
}

function generateGridWidgets(container, cid) {
  const cols = 3;
  const rows = 3;

  const cellW = (container.clientWidth - (cols + 1) * PADDING) / cols;
  const cellH = (container.clientHeight - (rows + 1) * PADDING) / rows;

  let idx = 0;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (idx >= 6) return;

      const x = PADDING + c * (cellW + PADDING);
      const y = PADDING + r * (cellH + PADDING);

      createWidget(container, cid, x, y, cellW, cellH);
      idx++;
    }
  }
}

// ---------------- Widget Factory ----------------
function createWidget(container, cid, x, y, w, h) {
  const type = choice(WIDGET_TYPES);
  const wid = "widget_" + widgetCounter++;

  let el;
  if (type === "button") {
    el = document.createElement("button");
    el.textContent = "Button";
  } else if (type === "input") {
    el = document.createElement("input");
    el.placeholder = "Input";
  } else if (type === "label") {
    el = document.createElement("label");
    el.textContent = "Label";
  } else if (type === "checkbox") {
    el = document.createElement("input");
    el.type = "checkbox";
  }

  el.style.position = "absolute";
  el.style.left = x + "px";
  el.style.top = y + "px";
  el.style.width = w + "px";
  el.style.height = h + "px";

  container.appendChild(el);

  const containerJSON = GUI_STATE.containers.find(c => c.id === cid);
  containerJSON.widgets.push({
    id: wid,
    type: type,
    x: x,
    y: y,
    width: w,
    height: h
  });
}

// ---------------- JSON Export ----------------
function exportJSON() {
  const blob = new Blob([JSON.stringify(GUI_STATE, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "gui_annotation.json";
  a.click();
}

// ---------------- Run ----------------
generateGUI();
</script>

</body>
</html>
